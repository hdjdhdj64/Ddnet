name: Build Server Linux

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-server:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
            cmake-args: -G Ninja
            cmake-init-env: CXXFLAGS=-Werror
            package-file: "*-linux_x86_64.tar.xz"

          - name: linux-x86_64-ubuntu22
            os: ubuntu-22.04
            arch: x86_64
            cmake-args: -G "Unix Makefiles"
            cmake-init-env: CXXFLAGS=-Werror
            package-file: "*-linux_x86_64.tar.xz"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            ninja-build \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libfreetype6-dev \
            libpng-dev

      - name: Build server in release mode
        run: |
          mkdir build
          cd build
          ${{ matrix.cmake-init-env && format('cmake -E env {0}', matrix.cmake-init-env) || '' }} \
            cmake ${{ matrix.cmake-args }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DSERVER=ON \
            -DCLIENT=OFF \
            -DTOOLS=OFF \
            -DVIDEORECORDER=OFF \
            -DVULKAN=OFF \
            -Werror=dev \
            ..
          cmake --build . --config Release -j$(nproc)

      - name: Test server startup
        run: |
          cd build
          ./DDNet-Server shutdown

      - name: Package server
        run: |
          cd build
          mkdir -p artifacts
          if [ -f DDNet-Server ]; then
            tar -cJf artifacts/ddnet-server-${{ matrix.arch }}.tar.xz DDNet-Server
          else
            echo "Error: DDNet-Server binary not found"
            exit 1
          fi
          ls -la artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-server-${{ matrix.name }}
          path: build/artifacts/

  build-server-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: uraimo/run-on-arch-action@v2
        name: Build server for aarch64
        id: build
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          setup: mkdir -p "${PWD}/artifacts"
          dockerRunArgs: --volume "${PWD}/artifacts:/artifacts"
          install: |
            apt-get update -y
            apt-get install -y \
              build-essential \
              cmake \
              git \
              pkg-config \
              libsqlite3-dev \
              libcurl4-openssl-dev \
              libssl-dev \
              libfreetype6-dev \
              libpng-dev \
              python3
          run: |
            mkdir build
            cd build
            cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DSERVER=ON \
              -DCLIENT=OFF \
              -DTOOLS=OFF \
              -DVIDEORECORDER=OFF \
              -DVULKAN=OFF \
              ..
            cmake --build . --config Release -j$(nproc)
            if [ ! -f DDNet-Server ]; then
              echo "Error: DDNet-Server binary not found"
              exit 1
            fi
            ./DDNet-Server shutdown
            tar -cJf /artifacts/ddnet-server-aarch64.tar.xz DDNet-Server
            ls -la /artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-server-linux-aarch64
          path: artifacts/
