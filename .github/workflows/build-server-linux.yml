name: Build Server Linux

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-server:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
            cmake-args: -G Ninja
            cmake-init-env: CXXFLAGS=-Werror
            package-file: "*-linux_x86_64.tar.xz"

          - name: linux-x86_64-ubuntu22
            os: ubuntu-22.04
            arch: x86_64
            cmake-args: -G "Unix Makefiles"
            cmake-init-env: CXXFLAGS=-Werror
            package-file: "*-linux_x86_64.tar.xz"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            ninja-build \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libfreetype6-dev \
            libpng-dev

      - name: Build server in release mode
        run: |
          mkdir build
          cd build
          ${{ matrix.cmake-init-env && format('cmake -E env {0}', matrix.cmake-init-env) || '' }} \
            cmake ${{ matrix.cmake-args }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DSERVER=ON \
            -DCLIENT=OFF \
            -DTOOLS=OFF \
            -DVIDEORECORDER=OFF \
            -DVULKAN=OFF \
            -Werror=dev \
            ..
          cmake --build . --config Release -j$(nproc)

      - name: Test server startup
        run: |
          cd build
          ./DDNet-Server shutdown

      - name: Package server
        run: |
          cd build
          mkdir -p artifacts
          if [ -f DDNet-Server ]; then
            tar -cJf artifacts/ddnet-server-${{ matrix.arch }}.tar.xz DDNet-Server
          else
            echo "Error: DDNet-Server binary not found"
            exit 1
          fi
          ls -la artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-server-${{ matrix.name }}
          path: build/artifacts/

  build-server-aarch64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up aarch64 cross-compilation
        run: |
          sudo dpkg --add-architecture arm64
          # Pin existing sources to amd64 only, add arm64 sources from ports.ubuntu.com
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get install -y libsqlite3-dev:arm64 libcurl4-openssl-dev:arm64 libssl-dev:arm64 libfreetype6-dev:arm64 libpng-dev:arm64 zlib1g-dev:arm64
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add aarch64-unknown-linux-gnu

      - name: Create cross-compilation toolchain file
        run: |
          echo 'set(CMAKE_SYSTEM_NAME Linux)' > /tmp/aarch64-toolchain.cmake
          echo 'set(CMAKE_SYSTEM_PROCESSOR aarch64)' >> /tmp/aarch64-toolchain.cmake
          echo 'set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)' >> /tmp/aarch64-toolchain.cmake
          echo 'set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)' >> /tmp/aarch64-toolchain.cmake
          echo 'set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu /usr/lib/aarch64-linux-gnu)' >> /tmp/aarch64-toolchain.cmake
          echo 'set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)' >> /tmp/aarch64-toolchain.cmake
          echo 'set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)' >> /tmp/aarch64-toolchain.cmake
          echo 'set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE BOTH)' >> /tmp/aarch64-toolchain.cmake
          echo 'set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)' >> /tmp/aarch64-toolchain.cmake
          echo 'set(CMAKE_RUST_COMPILER_TARGET aarch64-unknown-linux-gnu)' >> /tmp/aarch64-toolchain.cmake

      - name: Build server for aarch64
        run: |
          . "$HOME/.cargo/env"
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          mkdir build
          cd build
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/aarch64-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DSERVER=ON \
            -DCLIENT=OFF \
            -DTOOLS=OFF \
            -DVIDEORECORDER=OFF \
            -DVULKAN=OFF \
            ..
          cmake --build . --config Release -j$(nproc)

      - name: Package server
        run: |
          cd build
          mkdir -p artifacts
          if [ -f DDNet-Server ]; then
            tar -cJf artifacts/ddnet-server-aarch64.tar.xz DDNet-Server
          else
            echo "Error: DDNet-Server binary not found"
            exit 1
          fi
          ls -la artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ddnet-server-linux-aarch64
          path: build/artifacts/
